name: mindbridge
description: AI Ψυχολόγος — MindBridge app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── State Management ──────────────────────────
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # ── Navigation ────────────────────────────────
  go_router: ^14.2.0

  # ── Network ───────────────────────────────────
  dio: ^5.6.0
  web_socket_channel: ^3.0.1
  json_annotation: ^4.9.0

  # ── Local Storage ─────────────────────────────
  flutter_secure_storage: ^9.2.2
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.2

  # ── Data Classes ──────────────────────────────
  freezed_annotation: ^2.4.4

  # ── UI ────────────────────────────────────────
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  fl_chart: ^0.68.0           # Mood charts
  lottie: ^3.1.2              # Animations (breathing)
  flutter_animate: ^4.5.0     # Page transitions

  # ── Utils ─────────────────────────────────────
  intl: ^0.19.0
  logger: ^2.4.0
  package_info_plus: ^8.0.2
  url_launcher: ^6.3.0
  permission_handler: ^11.3.1

  # ── Push Notifications ────────────────────────
  firebase_core: ^3.4.0
  firebase_messaging: ^15.1.0
  flutter_local_notifications: ^17.2.2

  # ── Audio (exercises) ─────────────────────────
  just_audio: ^0.9.40
  audio_session: ^0.1.21

  # ── Crypto / Security ─────────────────────────
  crypto: ^3.0.5
  encrypt: ^5.0.3
  pointycastle: ^3.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  riverpod_generator: ^2.4.3
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
    - assets/audio/
  # fonts: add Inter or custom font files to assets/fonts/ and uncomment
